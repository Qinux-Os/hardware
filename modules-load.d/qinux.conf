# Modules always loaded at boot.
#
# Loading a module by name here is a last resort. udev loads a module when the
# device that needs it appears, which is earlier and more correct than this
# list. Every line added here should have a reason.

# Filesystems mounted before the root filesystem is available. Without these a
# root on LUKS, or on LVM, or on RAID, cannot be reached.
# Filesystem drivers are pulled in by the block and filesystems mkinitcpio
# hooks instead, so they are deliberately absent here.

# Cgroups, needed by systemd. Normally loaded by systemd itself.

# Bluetooth firmware helpers, loaded early because a headset is usually the
# first thing a user connects.
# module: btusb

# Printk. Loaded explicitly so that rate limiting applies to the kernel ring
# buffer, not just to the journal.
module printk