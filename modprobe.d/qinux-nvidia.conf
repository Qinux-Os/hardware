# NVIDIA module loading.
#
# Forwards every NVIDIA module request to a loader that inspects the PCI ID and
# loads the matching module for the installed driver version. Loading nvidia
# directly is the usual cause of "NVIDIA kernel module is not built for the
# running kernel" after a kernel update, because the module name alone does not
# identify which driver generation the hardware needs.
#
# The loader lives in qinux-hardware. If that package is removed, these lines
# are removed with it, and the distribution falls back to plain module loading.

install nvidia /usr/bin/qinux-hardware-load-module nvidia
install nvidia_drm /usr/bin/qinux-hardware-load-module nvidia_drm
install nvidia_uvm /usr/bin/qinux-hardware-load-module nvidia_uvm
install nvidia_modeset /usr/bin/qinux-hardware-load-module nvidia_modeset
install nvidia_modeset_drm /usr/bin/qinux-hardware-load-module nvidia_modeset