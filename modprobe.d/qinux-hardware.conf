# Modules loaded early, before udev settles.
#
# Loading a module by hand at boot is only for hardware the modalias mechanism
# cannot describe. Everything else should be left to udev, which loads it when
# the device appears and not otherwise.

# Common laptop hardware that has no modalias or needs to exist before the
# display server starts.

# Storage controllers that fail to probe as PCIe unless the module is present
# first. Without this an NVMe drive can be invisible on some laptops.
options nvme_core max_host_mem_size_mb=4096

# Wireless. iwd is the default supplicant; wpa_supplicant is loaded instead if
# it is installed and configured. Having both present is fine, iwd takes
# precedence unless NetworkManager is configured otherwise.
# options iwd powersave enable

# Touchpads and trackpoints. i2c_hid is needed on many laptops before
# psmouse can bind to the device.
options i2c_hid i2c_hid_hw_timeout=5

# Printk rate limiting. Without this, a device that fails repeatedly can flood
# the journal and make the system feel unresponsive while it logs.
options printk_ratelimit=5
options printk_ratelimit_burst=10